<!DOCTYPE html>
<html>
<head>
    <title>Student Information System</title>
    <link rel="stylesheet" href="student_dashboard.css">
</head>
<body>


<header class="header">
    <div class="logo-box">
        <img src="logo.png" alt="University Logo">
    </div>

    <div class="uni_name">
        <h2>VAST University</h2>
        <p>Gujranwala</p>
    </div>

    <div class="ems">
        <h2 style="margin-right: 50px;">Student Dashboard</h2>
    </div>
     <div class="logout-button" style="margin-left:auto;">
        <button onclick="window.location.href='student_login.html'" 
                style="
                    padding: 8px 16px;
                    background:#e74c3c;
                    color:white;
                    border:none;
                    border-radius:5px;
                    cursor:pointer;
                    font-weight:bold;
                    margin-top: 150px ;
                ">
            Logout
        </button>
    </div>
</header>
<div class="dashboard-cards">
    <div class="card">
        <div class="card-icon">📅</div>
        <h3>View Attendance</h3>
        <p>view your attendance records.</p>
        <button class="card-button" onclick="window.location.href='view_attendance.html'">Go to Attendance</button>
    </div>
</div>

</body>
</html>

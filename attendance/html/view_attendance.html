<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Attendance</title>

    <link rel="stylesheet" href="view_attendance.css">
</head>

<body>
 <div class="logout-button" style="margin-left:auto;">
        <button onclick="window.location.href='student_dashboard.html'" 
                style="
                    padding: 8px 16px;
                    background:#e74c3c;
                    color:white;
                    border:none;
                    border-radius:5px;
                    cursor:pointer;
                    font-weight:bold;
                    
                ">
             &#8592; Back To Dashboard
        </button>
    </div>
<div class="container">
    <h2>Student Attendance</h2>

    <div class="info">
        <p><strong>Name:</strong> Hamad Riyaz</p>
        <p><strong>Roll No:</strong> 23-CS-101</p>
        <p><strong>Semester:</strong> 1st</p>
    </div>

    <table>
        <thead>
            <tr>
                <th>Subject</th>
                <th>Total Classes</th>
                <th>Attended</th>
                <th>Attendance %</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="attendanceTable">
            <!-- Data will come from JavaScript -->
        </tbody>
    </table>
</div>

<script>
    // Attendance Data (Dynamic)
    const attendanceData = [
        { subject: "Programming Fundamentals", total: 40, attended: 34 },
        { subject: "Discrete Mathematics", total: 38, attended: 30 },
        { subject: "Digital Logic Design", total: 36, attended: 24 }
    ];

    const table = document.getElementById("attendanceTable");

    attendanceData.forEach(item => {
        const percentage = ((item.attended / item.total) * 100).toFixed(1);
        const status = percentage >= 75 ? "Good" : "Low";
        const statusClass = percentage >= 75 ? "good" : "low";

        table.innerHTML += `
            <tr>
                <td>${item.subject}</td>
                <td>${item.total}</td>
                <td>${item.attended}</td>
                <td>${percentage}%</td>
                <td class="${statusClass}">${status}</td>
            </tr>
        `;
    });
</script>

</body>
</html>
